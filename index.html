<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>J15 Monopoly 香港版記帳器</title>
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card2:#222630; --border:#2e3340;
  --txt:#e8eaed; --dim:#8b90a0; --accent:#f0b429; --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
  --brown:#8b5a2b; --lightblue:#7dd3fc; --pink:#f472b6; --orange:#fb923c;
  --yellow:#facc15; --green2:#4ade80; --darkblue:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;padding-bottom:80px}
.header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--border);z-index:10;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700}
.header h1 span{color:var(--accent)}
.header .ver{font-size:11px;color:var(--dim)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20;max-width:720px;margin:0 auto}
.tab{flex:1;text-align:center;padding:10px 4px;cursor:pointer;color:var(--dim);font-size:12px;transition:.2s}
.tab.active{color:var(--accent)}
.tab .ico{font-size:20px;display:block;margin-bottom:2px}
.page{display:none;padding:12px;max-width:720px;margin:0 auto}
.page.active{display:block}

.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pcard{background:var(--card);border-radius:12px;padding:12px;border-left:4px solid var(--accent)}
.pcard .pname{font-size:14px;font-weight:600;margin-bottom:4px}
.pcard .pbal{font-size:22px;font-weight:700;color:var(--accent)}
.pcard .pbal.neg{color:var(--red)}
.pcard .pprops{font-size:11px;color:var(--dim);margin-top:4px}

.add-player{background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px}
.add-player h4{font-size:13px;color:var(--dim);margin-bottom:8px}
.preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pchip{padding:6px 14px;border-radius:20px;background:var(--card2);border:2px solid var(--border);cursor:pointer;font-size:13px;transition:.2s}
.pchip.sel{border-color:var(--accent);background:rgba(240,180,41,.15);color:var(--accent)}
.custom-row{display:flex;gap:8px}
.custom-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--txt);font-size:14px}
.custom-row button{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}

.txn-form{background:var(--card);border-radius:12px;padding:14px;margin-bottom:16px}
.txn-form h3{font-size:14px;margin-bottom:10px;color:var(--accent)}
.txn-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.txn-row label{font-size:12px;color:var(--dim);width:60px;flex-shrink:0}
.txn-row select,.txn-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--txt);font-size:14px}
.txn-row input[type=number]{text-align:right}
.txn-submit{width:100%;background:var(--green);color:#000;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.txn-type-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ttype{flex:1;min-width:60px;text-align:center;padding:8px 4px;border-radius:8px;background:var(--card2);cursor:pointer;font-size:12px;border:2px solid transparent}
.ttype.active{border-color:var(--accent);background:rgba(240,180,41,.15)}

.prop-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prop{background:var(--card);border-radius:10px;padding:10px;border-top:4px solid var(--border);position:relative;cursor:pointer;transition:.15s}
.prop:active{transform:scale(.97)}
.prop .pname{font-size:13px;font-weight:600}
.prop .pprice{font-size:11px;color:var(--dim)}
.prop .powner{font-size:11px;margin-top:4px;font-weight:600}
.prop .phouses{font-size:12px;margin-top:2px}
.prop.noprop{opacity:.5}
.prop.special{text-align:center;border-top-color:#6b7280}
.prop.special .pname{font-size:12px;color:var(--accent)}
.prop.tax{border-top-color:var(--red)}
.prop.go{border-top-color:var(--green)}
.prop.jail{border-top-color:var(--blue)}

.ledger{background:var(--card);border-radius:12px;padding:4px 0}
.ledger-item{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:13px}
.ledger-item:last-child{border-bottom:none}
.ledger-item .lmeta{font-size:11px;color:var(--dim)}
.ledger-item .lamt{font-weight:700;white-space:nowrap}
.lamt.pos{color:var(--green)}
.lamt.neg{color:var(--red)}

.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.toolbar button{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer}
.toolbar button.danger{border-color:var(--red);color:var(--red)}
.toolbar button.cloud{border-color:var(--blue);color:var(--blue)}

.section-title{font-size:13px;color:var(--dim);margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px}
.empty{text-align:center;color:var(--dim);padding:30px;font-size:14px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.modal select,.modal textarea,.modal input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--txt);font-size:14px;margin-bottom:10px}
.modal textarea{min-height:120px;font-family:monospace;font-size:11px}
.modal .mbtns{display:flex;gap:8px}
.modal .mbtns button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.modal .mok{background:var(--green);color:#000}
.modal .mcancel{background:var(--card2);color:var(--txt)}
</style>
</head>
<body>

<div class="header">
  <h1>J15 <span>Monopoly HK</span></h1>
  <span class="ver" id="ver">v1.22</span>
</div>

<div class="page active" id="page-players">
  <div class="toolbar">
    <button class="cloud" onclick="cloudSave()">☁️ 上傳雲端</button>
    <button class="cloud" onclick="cloudLoad()">☁️ 雲端匯入</button>
    <button class="danger" onclick="resetGame()">🗑 重開</button>
  </div>

  <div class="add-player" id="setupPanel">
    <h4>選擇玩家（從名單揀）</h4>
    <div class="preset-row" id="presetRow"></div>
    <div class="custom-row">
      <input type="text" id="newPlayerName" placeholder="自訂玩家名" maxlength="12">
      <button onclick="addCustomPlayer()">+ 加入</button>
    </div>
    <button class="txn-submit" style="margin-top:10px" onclick="startGame()">🎲 開始遊戲</button>
  </div>

  <div class="player-grid" id="playerGrid"></div>

  <div class="txn-form">
    <h3>💰 記一筆交易</h3>
    <div class="txn-type-row" id="txnTypes">
      <div class="ttype active" data-type="buy" onclick="setTxnType(this)">🛒 買地</div>
      <div class="ttype" data-type="rent" onclick="setTxnType(this)">🏠 收租</div>
      <div class="ttype" data-type="bank" onclick="setTxnType(this)">🏦 銀行</div>
      <div class="ttype" data-type="house" onclick="setTxnType(this)">🏗 建屋</div>
    </div>
    <div class="txn-row">
      <label>玩家</label>
      <select id="txnPlayer"></select>
    </div>
    <div class="txn-row" id="txnTargetRow" style="display:none">
      <label>租出方</label>
      <select id="txnTarget"></select>
    </div>
    <div class="txn-row">
      <label>金額</label>
      <input type="number" id="txnAmount" placeholder="0" value="0">
    </div>
    <div class="txn-row">
      <label>備註</label>
      <input type="text" id="txnNote" placeholder="例如：買灣仔 / 過關收$200" maxlength="40">
    </div>
    <button class="txn-submit" onclick="addTransaction()">確認入帳</button>
  </div>
</div>

<div class="page" id="page-props">
  <div class="section-title">🗺️ 棋盤（點擊觸發）</div>
  <div id="propList"></div>
</div>

<div class="page" id="page-ledger">
  <div class="section-title">📜 完整流水帳</div>
  <div class="ledger" id="ledgerFull"></div>
</div>

<div class="tabs">
  <div class="tab active" data-page="players" onclick="switchTab(this)"><span class="ico">👥</span>玩家</div>
  <div class="tab" data-page="props" onclick="switchTab(this)"><span class="ico">🗺️</span>棋盤</div>
  <div class="tab" data-page="ledger" onclick="switchTab(this)"><span class="ico">📜</span>帳本</div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="mbtns">
      <button class="mcancel" onclick="closeModal()">取消</button>
      <button class="mok" id="modalOk" onclick="modalConfirm()">確認</button>
    </div>
  </div>
</div>

const START_MONEY = 1500;

let state = {
  version: "1.20",
  started: false,
  gameId: null,
  startMoney: START_MONEY,
  players: [],
  props: {},
  ledger: [],
  nextPlayerId: 1,
};

BOARD.forEach(p => {
  if(p.type==="prop"||p.type==="station"||p.type==="utility"){
    state.props[p.id] = {owner:null, houses:0, hotel:false};
  }
});

let currentTxnType = "buy";
let selectedPreset = new Set();

function load(){
  const saved = localStorage.getItem("j15monopoly");
  if(saved){
    try{ state = JSON.parse(saved); }catch(e){ console.warn(e); }
  }
  renderPresets();
  render();
}
function save(){ localStorage.setItem("j15monopoly", JSON.stringify(state)); }

function renderPresets(){
  const row = document.getElementById("presetRow");
  row.innerHTML = PRESET_PLAYERS.map(name =>
    '<div class="pchip'+(selectedPreset.has(name)?' sel':'')+'" onclick="togglePreset(this,\''+name+'\')">'+name+'</div>'
  ).join("");
}
function togglePreset(el, name){
  if(selectedPreset.has(name)){ selectedPreset.delete(name); el.classList.remove("sel"); }
  else { selectedPreset.add(name); el.classList.add("sel"); }
}

function addCustomPlayer(){
  const name = document.getElementById("newPlayerName").value.trim();
  if(!name) return;
  selectedPreset.add(name);
  document.getElementById("newPlayerName").value = "";
  renderPresets();
}

function startGame(){
  if(selectedPreset.size===0){ alert("請至少選擇一位玩家"); return; }
  state.players = Array.from(selectedPreset).map((name,i)=>({
    id:"p"+(i+1), name:name, balance:START_MONEY, color:PLAYER_COLORS[i%PLAYER_COLORS.length]
  }));
  state.started = true;
  save(); render();
}

function getPlayer(id){ return state.players.find(p=>p.id===id); }
function playerPropCount(pid){ return Object.values(state.props).filter(pr=>pr.owner===pid).length; }

function setTxnType(el){
  document.querySelectorAll(".ttype").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  currentTxnType = el.dataset.type;
  document.getElementById("txnTargetRow").style.display = (currentTxnType==="rent") ? "flex" : "none";
}

function logTxn(pid, signedAmt, type, note){
  const player = getPlayer(pid);
  state.ledger.push({
    t: new Date().toLocaleTimeString("zh-HK",{hour:'2-digit',minute:'2-digit'}),
    pid, pname: player.name, type, amt: signedAmt, note
  });
}

function addTransaction(){
  const pid = document.getElementById("txnPlayer").value;
  const amount = parseFloat(document.getElementById("txnAmount").value)||0;
  const note = document.getElementById("txnNote").value.trim();
  if(!pid || amount===0) return;
  const player = getPlayer(pid);
  let signedAmt = amount;
  if(currentTxnType==="buy" || currentTxnType==="house") signedAmt = -Math.abs(amount);
  if(currentTxnType==="rent"){
    const tid = document.getElementById("txnTarget").value;
    const target = getPlayer(tid);
    signedAmt = -Math.abs(amount);
    target.balance += Math.abs(amount);
    logTxn(tid, Math.abs(amount), "rent", note||"收租 from "+player.name);
  }
  player.balance += signedAmt;
  logTxn(pid, signedAmt, currentTxnType, note);
  document.getElementById("txnAmount").value = "0";
  document.getElementById("txnNote").value = "";
  save(); render();
}

function pickPlayer(title, cb){
  showModal(title,
    '<select id="modalPlayer">'+state.players.map(p=>'<option value="'+p.id+'">'+p.name+' ($'+p.balance+')</option>').join("")+'</select>',
    ()=>{ cb(document.getElementById("modalPlayer").value); }
  );
}

function propClick(pid){
  const p = BOARD[pid];
  if(!state.started || state.players.length===0){ alert("請先開始遊戲"); return; }

  // Special spaces with actions
  if(p.action==="tax"){
    pickPlayer(p.cn+" 扣 $"+p.price, (pid)=>{
      const pl = getPlayer(pid);
      pl.balance -= p.price;
      logTxn(pid, -p.price, "tax", p.cn);
      save(); render();
    });
    return;
  }
  if(p.action==="go"){
    pickPlayer("經過 GO 收 $200", (pid)=>{
      const pl = getPlayer(pid);
      pl.balance += 200;
      logTxn(pid, 200, "go", "經過GO");
      save(); render();
    });
    return;
  }
  if(p.action==="gotojail"){
    pickPlayer("入獄 — "+p.cn, (pid)=>{
      logTxn(pid, 0, "jail", "入獄");
      save(); render();
    });
    return;
  }
  if(p.action==="jail"){
    pickPlayer("監獄 — 邊位玩家？", (pid)=>{
      const choice = confirm(p.cn+"\n\n確定出監？扣 $50 保釋金\n\n（Cancel = 淨係探監/出獄卡）");
      if(choice){
        const pl = getPlayer(pid);
        pl.balance -= 50;
        logTxn(pid, -50, "jail", "出監保釋金 $50");
      } else {
        logTxn(pid, 0, "jail", "到監獄（探監/出獄卡）");
      }
      save(); render();
    });
    return;
  }
  if(p.action==="free"){
    pickPlayer("免費泊車 — 收銀行利息？", (pid)=>{
      const amt = prompt("收幾多？（入0跳過）");
      if(amt && parseFloat(amt)!==0){
        const pl = getPlayer(pid);
        pl.balance += parseFloat(amt);
        logTxn(pid, parseFloat(amt), "free", "免費泊車");
      }
      save(); render();
    });
    return;
  }
  if(p.action==="cc" || p.action==="chance"){
    const deck = p.action==="cc" ? CC_CARDS : CHANCE_CARDS;
    const deckName = p.action==="cc" ? "公益福利卡" : "機會卡";
    pickPlayer("抽中"+deckName+" — 邊位玩家？", (pid)=>{
      let html = '<select id="modalCard" style="margin-bottom:8px">'+
        deck.map((c,i)=>'<option value="'+i+'">'+c.name+(c.amt!==null?(c.amt>0?' +$'+c.amt:' -$'+Math.abs(c.amt)):'')+'</option>').join("")+
        '</select>';
      showModal("🎴 "+deckName, html, ()=>{
        const ci = parseInt(document.getElementById("modalCard").value);
        const card = deck[ci];
        const player = getPlayer(pid);
        if(card.amt===null && card.settle==="collect_all"){
          state.players.forEach(o=>{
            if(o.id!==pid){
              o.balance -= card.per;
              logTxn(o.id, -card.per, "card", card.name+" → "+player.name);
            }
          });
          player.balance += card.per*(state.players.length-1);
          logTxn(pid, card.per*(state.players.length-1), "card", card.name);
        } else if(card.amt===null && card.settle==="pay_all"){
          state.players.forEach(o=>{
            if(o.id!==pid){
              o.balance += card.per;
              logTxn(o.id, card.per, "card", card.name+" ← "+player.name);
            }
          });
          player.balance -= card.per*(state.players.length-1);
          logTxn(pid, -card.per*(state.players.length-1), "card", card.name);
        } else if(card.amt===null){
          const amt = prompt(card.name+" — 手動輸入金額（正=收, 負=付）：");
          if(amt && parseFloat(amt)!==0){
            player.balance += parseFloat(amt);
            logTxn(pid, parseFloat(amt), "card", card.name);
          }
        } else if(card.amt!==0){
          player.balance += card.amt;
          logTxn(pid, card.amt, "card", card.name);
        } else {
          logTxn(pid, 0, "card", card.name);
        }
        save(); render();
      });
    });
    return;
  }

  // Properties
  const pr = state.props[pid];
  if(pr.owner){ showPropActions(pid); }
  else { buyProperty(pid); }
}

function countOwnedColorGroup(pid){
  const p = BOARD[pid];
  if(!p.color) return 0;
  return Object.entries(state.props).filter(([id,pr])=>BOARD[id].color===p.color && pr.owner===state.props[pid].owner).length;
}
function countOwnedStations(ownerId){
  return Object.values(state.props).filter(pr=>pr.owner===ownerId && BOARD.find(b=>b.id===Object.keys(state.props).find(k=>state.props[k]===pr))?.type==="station").length;
}
function calcRent(pid){
  const p = BOARD[pid];
  const pr = state.props[pid];
  if(p.type==="station"){
    const cnt = Object.entries(state.props).filter(([id,pr2])=>pr2.owner===pr.owner && BOARD[id].type==="station").length;
    return STATION_RENT[Math.min(cnt,4)];
  }
  if(p.type==="utility"){ return -1; }
  const rd = RENT_DATA[pid];
  if(!rd) return 0;
  if(pr.hotel) return rd.h;
  if(pr.houses===4) return rd.r4;
  if(pr.houses===3) return rd.r3;
  if(pr.houses===2) return rd.r2;
  if(pr.houses===1) return rd.r1;
  // color set bonus: double base rent
  const colorProps = BOARD.filter(b=>b.color===p.color);
  const ownedColor = colorProps.filter(b=>state.props[b.id].owner===pr.owner).length;
  return ownedColor===colorProps.length ? rd.r0*2 : rd.r0;
}

function showPropActions(pid){
  const p = BOARD[pid];
  const pr = state.props[pid];
  const owner = getPlayer(pr.owner);
  const hcost = Math.floor(p.price/2);
  const rent = calcRent(pid);
  const canBuild = (p.type==="prop");
  let houseLabel = pr.hotel ? "拆酒店 (退$"+hcost+")" : (pr.houses>=4 ? "起酒店 ($"+hcost+")" : canBuild ? "起屋 ("+(pr.houses+1)+"屋, $"+hcost+")" : "此類不能起屋");

  let rentLabel;
  if(p.type==="station"){
    const cnt = Object.entries(state.props).filter(([id,pr2])=>pr2.owner===owner.id && BOARD[id].type==="station").length;
    rentLabel = "收租 $"+rent+"（持"+cnt+"站）";
  } else if(p.type==="utility"){
    const utilCount = Object.entries(state.props).filter(([id,pr2])=>pr2.owner===owner.id && BOARD[id].type==="utility").length;
    rentLabel = "收租（擲點×"+(utilCount>=2?10:4)+"）";
  } else {
    rentLabel = "收租 $"+rent;
  }

  showModal(p.cn+" — "+owner.name+" 擁有",
    '<div style="display:flex;gap:8px;margin-bottom:10px">'+
      (canBuild ? '<div style="flex:1;background:var(--card2);padding:12px;border-radius:8px;text-align:center;cursor:pointer" onclick="doToggleHouse('+pid+')">'+
        '<div style="font-size:24px">🏗</div><div style="font-size:12px;font-weight:600;margin-top:4px">'+houseLabel+'</div></div>' : '')+
      '<div style="flex:1;background:var(--card2);padding:12px;border-radius:8px;text-align:center;cursor:pointer" onclick="doRent('+pid+')">'+
        '<div style="font-size:24px">💰</div><div style="font-size:12px;font-weight:600;margin-top:4px">'+rentLabel+'</div></div>'+
    '</div>',
    ()=>{}
  );
  document.getElementById("modalOk").style.display = "none";
}

function doToggleHouse(pid){
  closeModal(); toggleHouse(pid);
}

function doRent(pid){
  closeModal();
  const p = BOARD[pid];
  const pr = state.props[pid];
  const owner = getPlayer(pr.owner);
  pickPlayer("邊位交租畀 "+owner.name+"？（"+p.cn+"）", (tenantId)=>{
    let amt;
    if(p.type==="utility"){
      const utilCount = Object.entries(state.props).filter(([id,pr2])=>pr2.owner===owner.id && BOARD[id].type==="utility").length;
      const mult = utilCount>=2 ? 10 : 4;
      const dice = prompt(p.cn+" — 擲咗幾點？（租金=點數×"+mult+"）");
      if(dice===null) return;
      amt = parseInt(dice)*mult;
    } else {
      const suggested = calcRent(pid);
      const input = prompt("租金金額？（建議 $"+suggested+"）", suggested);
      if(input===null) return;
      amt = parseFloat(input)||0;
    }
    if(amt===0) return;
    const tenant = getPlayer(tenantId);
    tenant.balance -= amt;
    owner.balance += amt;
    logTxn(tenantId, -amt, "rent", p.cn+" 租金畀 "+owner.name);
    logTxn(pr.owner, amt, "rent", "收租 from "+tenant.name+" ("+p.cn+")");
    save(); render();
  });
}

function buyProperty(pid){
  const p = BOARD[pid];
  pickPlayer("邊個買 "+p.cn+"？", (buyerId)=>{
    const buyer = getPlayer(buyerId);
    if(!confirm(buyer.name + " 買 " + p.cn + " $" + p.price + "？\n餘額：$" + buyer.balance)) return;
    buyer.balance -= p.price;
    state.props[pid].owner = buyer.id;
    logTxn(buyer.id, -p.price, "buy", "買 "+p.cn);
    save(); render();
  });
}

function toggleHouse(pid){
  const pr = state.props[pid];
  if(!pr.owner) return;
  const p = BOARD[pid];
  if(p.type!=="prop"){ alert("此類物業不能起屋"); return; }
  const owner = getPlayer(pr.owner);
  const rd = RENT_DATA[pid];
  if(!rd) return;
  const hcost = rd.hc;
  if(pr.hotel){
    pr.hotel = false; pr.houses = 4;
    owner.balance += hcost;
    logTxn(owner.id, hcost, "house", "拆酒店 "+p.cn+" (退回$"+hcost+")");
  } else if(pr.houses===4){
    pr.hotel = true;
    owner.balance -= hcost;
    logTxn(owner.id, -hcost, "house", "起酒店 "+p.cn+" ($"+hcost+")");
  } else {
    pr.houses++;
    owner.balance -= hcost;
    logTxn(owner.id, -hcost, "house", "起"+pr.houses+"屋 "+p.cn+" ($"+hcost+")");
  }
  save(); render();
}

// === Cloud Save / Load ===
function isLocal(){ return location.hostname==="localhost"||location.hostname==="127.0.0.1"; }
async function cloudSave(){
  if(!isLocal()){ alert("☁️ 雲端功能只係 localhost 先用得\n請用本地 server.py 開啟"); return; }
  try{
    const resp = await fetch("/api/save", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(state)
    });
    const r = await resp.json();
    if(r.ok){
      state.gameId = r.gameId;
      save();
      alert("✅ 已上傳！\n對戰編號：" + r.gameId + "\n寫入 " + r.count + " 筆流水");
    } else {
      alert("❌ 上傳失敗: " + (r.error||"未知"));
    }
  }catch(e){
    alert("❌ 連接失敗: " + e.message);
  }
}

async function cloudLoad(){
  if(!isLocal()){ alert("☁️ 雲端功能只係 localhost 先用得\n請用本地 server.py 開啟"); return; }
  try{
    const resp = await fetch("/api/games");
    const r = await resp.json();
    if(!r.ok || !r.games || r.games.length===0){ alert("冇歷史對戰"); return; }
    let html = '<select id="modalGame" style="margin-bottom:8px">';
    r.games.forEach(g=>{
      const p = g.state && g.state.players ? g.state.players.map(x=>x.name).join("/") : g.players;
      html += '<option value="'+g.gameId+'">'+g.gameId+' — '+p+' ('+g.txns+'筆)</option>';
    });
    html += '</select>';
    showModal("☁️ 揀對戰匯入", html, async ()=>{
      const gid = document.getElementById("modalGame").value;
      if(!confirm("載入 "+gid+"？")) return;
      const resp2 = await fetch("/api/load?gid="+gid);
      const r2 = await resp2.json();
      if(r2.ok && r2.data){
        state = Object.assign(state, r2.data.state);
        state.gameId = r2.data.gameId;
        state.started = true;
        save(); render();
        alert("✅ 已載入 "+gid);
      } else alert("匯入失敗");
    });
  }catch(e){ alert("❌ "+e.message); }
}

function deleteLedger(idx){
  if(!confirm("確定刪除呢筆交易？")) return;
  state.ledger.splice(idx, 1);
  save(); render();
}

function resetGame(){
  if(!confirm("確定重開？所有記錄會清除")) return;
  localStorage.removeItem("j15monopoly");
  location.reload();
}

function showModal(title, bodyHtml, onOk){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  document.getElementById("modalOk").style.display = "block";
  document.getElementById("modal").classList.add("show");
  window._modalCb = onOk;
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function modalConfirm(){
  const cb = window._modalCb;
  window._modalCb = null;
  if(cb) cb();
  if(!window._modalCb) closeModal();
}

function switchTab(el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("page-"+el.dataset.page).classList.add("active");
}

function typeLabel(t){
  return {buy:"買地",rent:"收租",bank:"銀行",house:"建屋",tax:"稅項",go:"出發金",jail:"監獄",card:"機會/公益",free:"免費泊車"}[t]||t;
}

function render(){
  document.getElementById("ver").textContent = "v"+state.version;
  document.getElementById("setupPanel").style.display = state.started ? "none" : "block";

  const grid = document.getElementById("playerGrid");
  if(state.players.length===0){
    grid.innerHTML = '<div class="empty" style="grid-column:1/3">尚未加入玩家</div>';
  } else {
    grid.innerHTML = state.players.map(p=>{
      let propValue = 0, houseValue = 0, propList = [];
      Object.entries(state.props).forEach(([pid,pr])=>{
        if(pr.owner===p.id){
          const b = BOARD[pid];
          const rd = RENT_DATA[pid];
          if(rd){
            propValue += rd.mort;
            houseValue += (pr.houses + (pr.hotel?1:0)) * rd.hc;
          }
          propList.push(b.cn);
        }
      });
      const total = p.balance + propValue + houseValue;
      return '<div class="pcard" style="border-left-color:'+p.color+'">'+
        '<div class="pname">'+p.name+'</div>'+
        '<div class="pbal '+(p.balance<0?'neg':'')+'">$'+p.balance.toLocaleString()+'</div>'+
        '<div style="font-size:12px;color:var(--green);font-weight:700;margin-top:2px">總資產 $'+total.toLocaleString()+'</div>'+
        '<div class="pprops">🏠'+propList.length+' 項 · 地產$'+propValue.toLocaleString()+' + 屋$'+houseValue.toLocaleString()+'</div>'+
      '</div>';
    }).join("");
  }

  const sel = document.getElementById("txnPlayer");
  sel.innerHTML = state.players.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("");
  const tsel = document.getElementById("txnTarget");
  tsel.innerHTML = state.players.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("");

  const all = state.ledger.slice().reverse();
  document.getElementById("ledgerFull").innerHTML = all.length===0
    ? '<div class="empty">未有交易記錄</div>'
    : all.map((l,ri)=>{
      const idx = state.ledger.length-1-ri;
      return '<div class="ledger-item">'+
        '<div style="flex:1"><div>'+l.pname+(l.note?(' · '+l.note):'')+'</div><div class="lmeta">'+l.t+' · '+typeLabel(l.type)+'</div></div>'+
        '<div class="lamt '+(l.amt>=0?'pos':'neg')+'">'+(l.amt>=0?'+':'')+'$'+Math.abs(l.amt).toLocaleString()+'</div>'+
        '<div style="margin-left:8px;cursor:pointer;color:var(--red);font-size:16px" onclick="deleteLedger('+idx+')">✕</div>'+
      '</div>';
    }).join("");

  document.getElementById("propList").innerHTML = BOARD.map(p=>{
    if(p.type==="special"){
      let cls = "prop special";
      if(p.action==="tax") cls += " tax";
      if(p.action==="go") cls += " go";
      if(p.action==="jail"||p.action==="gotojail") cls += " jail";
      return '<div class="'+cls+'" onclick="propClick('+p.id+')"><div class="pname">'+p.cn+'</div>'+(p.price?'<div class="pprice">$'+p.price+'</div>':'')+'</div>';
    }
    const pr = state.props[p.id];
    const owner = pr.owner ? getPlayer(pr.owner) : null;
    const colorBar = (COLOR_HEX[p.color]||"var(--border)");
    let houses = "";
    if(pr.hotel) houses = "🏨";
    else if(pr.houses>0) houses = "🏠".repeat(pr.houses);
    return '<div class="prop '+p.type+'" style="border-top-color:'+colorBar+'" onclick="propClick('+p.id+')">'+
      '<div class="pname">'+p.cn+' <span style="color:var(--dim);font-weight:400">'+p.name+'</span></div>'+
      '<div class="pprice">$'+p.price.toLocaleString()+(p.type==='station'?' 🚆':p.type==='utility'?' 💡':'')+'</div>'+
      (owner?'<div class="powner" style="color:'+owner.color+'">👤 '+owner.name+'</div>':'<div class="pprice">未售</div>')+
      (houses?'<div class="phouses">'+houses+'</div>':'')+
    '</div>';
  }).join("");
}

load();
